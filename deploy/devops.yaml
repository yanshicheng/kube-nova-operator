# ============================================================
# KubeNova DevOps 模式部署示例
# 部署范围: DevOps + Portal
# 包含: portal-api, portal-rpc, devops-api,
#       devops-manager-rpc, devops-pipeline-rpc
# 注意: devops-quality-rpc 暂不部署
# ============================================================
apiVersion: apps.ikubeops.com/v1
kind: KubeNova
metadata:
  name: kubenova-devops
  namespace: kube-nova
spec:
  # 部署模式: devops = DevOps + Portal
  deploymentMode: devops

  # 全局镜像仓库配置
  imageRegistry:
    registry: "registry.cn-hangzhou.aliyuncs.com"
    organization: "kube-nova"
    tag: "latest"
    pullPolicy: Always

  # MySQL 数据库配置(必填)
  database:
    host: "mysql"
    port: 3306
    database: "kube_nova"
    user: "root"
    password: "8VlZ2lvIsKBCYSE3"
    maxOpenConns: 100
    maxIdleConns: 50
    connMaxLifetime: "30m"

  # Redis 缓存配置(必填)
  cache:
    host: "redis"
    port: 6379
    type: "node"
    password: "2VOSiz0vhGtxaBJb"
    tls: false
    nonBlock: true
    pingTimeout: "3s"

  # MinIO 对象存储配置(必填)
  storage:
    endpoint: "minio-service:9000"
    accessKey: "kube-nova-admin"
    secretKey: "KubeNova@2024SecretKey!"
    bucket: "kube-nova"
    endpointProxy: "http://127.0.0.1:30088/storage/"

  # MongoDB 配置(devops/all 模式必填)
  mongo:
    url: "mongodb://root:8VlZ2lvIsKBCYSE3@mongo:27017/?authSource=admin"
    db: "kube_nova_devops"

  # 链路追踪配置(可选)
  telemetry:
    enabled: true
    jaegerEndpoint: "http://jaeger-collector:14268/api/traces"
    sampler: "1.0"
    batcher: "jaeger"

  services:
    globalTimeout: 30000

    # JWT 配置(必填)
    jwt:
      accessSecret: "zk5Lp8m+0g7lvvLcnbUHPzQFEsRAmvNIn9tXdx0o80U="
      accessExpire: 86400
      refreshSecret: "zk5Lp8m+0g7lvvLcnbUHPzQFEsRAmvNIn9tXdx0o80U="
      refreshExpire: 604800
      refreshAfter: 604800

    # 全局 Leader Election 配置
    leaderElection:
      enabled: true
      leaseDuration: "15s"
      renewDeadline: "10s"
      retryPeriod: "2s"

    # Portal 配置
    portal:
      name: "Kube-Nova 云原生平台"
      url: "http://127.0.0.1:30088"
      demoMode: false

    # Webhook Token
    webhookToken: "mRwErqZaQVrxfyhiDQrdiQohAsONwSTtwhcmFXpCcaGavcINqorVoWINnSFFAijb"

    # 注入镜像
    injectImage: "registry.cn-hangzhou.aliyuncs.com/kube-nova/network-multitool:latest"

    # ========================================
    # 各服务配置(可选)
    # ========================================
    # portalAPI:
    #   replicas: 2
    # portalRPC:
    #   replicas: 2
    # devopsAPI:
    #   replicas: 2
    # devopsManagerRPC:
    #   replicas: 2
    # devopsPipelineRPC:
    #   replicas: 2

  # Web 前端配置(必填)
  web:
    replicas: 2
    exposeType: "nodeport"
    nodePort:
      httpPort: 30088
    minioProxy:
      enabled: true
      pathPrefix: "/storage"

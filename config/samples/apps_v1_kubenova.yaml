apiVersion: apps.ikubeops.com/v1
kind: KubeNova
metadata:
  name: kubenova-sample
  namespace: kube-nova
spec:
  # 部署模式: all(默认) / k8s / devops
  deploymentMode: all

  imageRegistry:
    registry: "registry.cn-hangzhou.aliyuncs.com"
    organization: "kube-nova"
    tag: "latest"
    pullPolicy: Always

  database:
    host: "mysql"
    port: 3306
    database: "kube_nova"
    user: "root"
    password: "8VlZ2lvIsKBCYSE3"

  cache:
    host: "redis"
    port: 6379
    type: "node"
    password: "2VOSiz0vhGtxaBJb"

  storage:
    endpoint: "minio-service:9000"
    accessKey: "kube-nova-admin"
    secretKey: "KubeNova@2024SecretKey!"
    bucket: "kube-nova"

  mongo:
    url: "mongodb://root:8VlZ2lvIsKBCYSE3@mongodb:27017/?authSource=admin"
    db: "kube_nova_devops"

  services:
    globalTimeout: 30000
    jwt:
      accessSecret: "zk5Lp8m+0g7lvvLcnbUHPzQFEsRAmvNIn9tXdx0o80U="
      accessExpire: 86400
      refreshSecret: "zk5Lp8m+0g7lvvLcnbUHPzQFEsRAmvNIn9tXdx0o80U="
      refreshExpire: 604800
      refreshAfter: 604800
    portal:
      name: "Kube-Nova"
      demoMode: false

  web:
    replicas: 2
    exposeType: "nodeport"
    nodePort:
      httpPort: 30088
